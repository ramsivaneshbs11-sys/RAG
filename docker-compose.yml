version: '3.8'

services:

  # ──────────────────────────── PostgreSQL Database ─────────────────────────────
  # Stores chat sessions, user notes, and document status records.
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: upsc_rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d upsc_rag"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────── Qdrant Vector Database ─────────────────────────
  # Stores all UPSC document embeddings in named collections.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ──────────────────────────── UPSC RAG Application ───────────────────────────
  # FastAPI backend + React frontend (built into the image via multi-stage Docker).
  # Access the full app at http://localhost:8000
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upsc_rag_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env                      # API keys & configurations
    environment:
      # Use internal docker service names when running inside docker-compose
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/upsc_rag
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      # Persist uploaded PDFs and extracted data across container restarts
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./outputs:/app/outputs
      # Persist the SQLite response cache
      - app_cache:/app/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s          # Give models time to pre-load on first start

volumes:
  postgres_data:
  qdrant_storage:
  app_cache:
